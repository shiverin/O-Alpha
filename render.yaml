services:
  - type: web
    name: oalpha-api
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: ./Dockerfile.render-api
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: oalpha-db
          property: connectionString
      - key: MIGRATIONS_PATH
        value: file:///migrations
      - key: HTTP_ADDR
        value: :10000
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_API_SECRET
        sync: false
      - key: ALPACA_DATA_URL
        value: https://data.alpaca.markets

databases:
  - name: oalpha-db
    databaseName: oalpha
    user: oalpha
    plan: free
