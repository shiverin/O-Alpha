services:
  - type: web
    name: oalpha-api
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: ./Dockerfile.render-api
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: MIGRATIONS_PATH
        value: file:///migrations
      - key: HTTP_ADDR
        value: :10000
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:3000,http://127.0.0.1:3000,https://o-alpha-tan.vercel.app
      - key: ALPACA_DATA_URL
        value: https://data.alpaca.markets
      - key: ALPACA_TRADING_URL
        value: https://paper-api.alpaca.markets
      - key: PORTFOLIO_EXECUTION_MODE
        value: internal
