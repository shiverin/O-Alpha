name: Portfolio Agent Worker

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum active portfolio agent runs to process."
        required: false
        default: "100"
        type: string
  schedule:
    # Hourly on weekdays. The agent's saved rebalance cadence still gates trades.
    - cron: "15 * * * 1-5"

concurrency:
  group: portfolio-agent-worker
  cancel-in-progress: false

jobs:
  run-once:
    name: Resume active portfolio agents
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: ./backend

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
      ALPACA_DATA_URL: https://data.alpaca.markets
      ALPACA_TRADING_URL: https://paper-api.alpaca.markets
      PORTFOLIO_EXECUTION_MODE: ${{ vars.PORTFOLIO_EXECUTION_MODE || 'internal' }}
      MIGRATIONS_PATH: file://../migrations
      RUN_LIMIT: ${{ github.event.inputs.limit || '100' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: backend/go.sum

      - name: Validate required secrets
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL}" ]; then
            echo "DATABASE_URL secret is required" >&2
            exit 1
          fi
          if [ -z "${ALPACA_API_KEY}" ] || [ -z "${ALPACA_API_SECRET}" ]; then
            echo "ALPACA_API_KEY and ALPACA_API_SECRET secrets are required" >&2
            exit 1
          fi

      - name: Run one-shot portfolio worker
        run: go run ./cmd/portfolio-worker -limit "${RUN_LIMIT}"
