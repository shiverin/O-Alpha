<!DOCTYPE html>

<style>
        .grid-bg {
            background-image: linear-gradient(to right, rgba(0, 229, 255, 0.05) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(0, 229, 255, 0.05) 1px, transparent 1px);
            background-size: 32px 32px;
        }
        .glass-card {
            background: rgba(18, 33, 49, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glow-active:focus-within {
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.2);
            border-color: rgba(0, 229, 255, 0.5);
        }
        
        /* Custom Range Slider */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #00e5ff;
            cursor: pointer;
            margin-top: -6px;
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.5);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
        }
        input[type=range]:focus::-webkit-slider-runnable-track {
            background: rgba(0, 229, 255, 0.2);
        }
    </style>

<body class="bg-background text-on-background min-h-screen grid-bg overflow-x-hidden flex flex-col font-body-md">
<!-- Top Navigation Anchor (Suppressed per instructions for focused transactional flow, but leaving structure if needed. Instructed to suppress for linear/transactional, and this is 'Phase 2.1' configurator.) -->
<!-- Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center px-margin-mobile md:px-margin-desktop py-grid-size relative z-10 w-full max-w-[1440px] mx-auto">
<!-- Header Section -->
<div class="text-center mb-12 max-w-2xl">
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface mb-4">Quant Alignment</h1>
<p class="font-data-lg text-data-lg text-on-surface-variant font-light tracking-wide">Translate your intent into mathematics.</p>
</div>
<!-- Central Imagery (Noise Processing Engine) -->
<div class="w-full max-w-4xl mb-16 relative flex justify-center items-center h-[300px] md:h-[400px] rounded-xl overflow-hidden glass-card">
<!-- Background glow behind image -->
<div class="absolute inset-0 bg-primary/5 blur-3xl rounded-full scale-150 z-0"></div>
<img alt="Noise Processing Engine" class="relative z-10 w-full h-full object-cover mix-blend-screen opacity-80" data-alt="A sophisticated abstract visualization of a high-frequency trading noise processing engine. The image features a sleek, dark aesthetic with deep navy backgrounds and glowing, electric cyan data streams acting as signals cutting through static 'noise'. The style is highly technical, precise, and glassmorphic, suggesting advanced artificial intelligence and mathematical filtration. The mood is calculated, confident, and futuristic, perfectly aligned with a quant-minimalist brand identity." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAvXDuPCKTGIAavWyndEWjHtnOgx_EjkYHVYgzglIyg2Q1kOyufahQc7C7asDt1vhFv5OkUqOmZeeE75KXuKru11Ex9eHVdZT1s9He4eLxgoRwXn_hKjKAcwDYpoQsnrv42jtej9hIDD95GRlSXvu4As1EWV9CQt1Rh_2f4T9hZVHUHdcEbeA_HkFvMpndtjk8PYgK_T3_4j2NFWJ2W6LsNPcl2kqXPdstG7WTVWLPpNKkjI6o0gbDmZVQnCImQ5A-gAPy2AgWr1WYe"/>
<!-- Overlay Interface Elements on Image to make it feel like an engine -->
<div class="absolute z-20 inset-0 flex items-center justify-between px-8 md:px-16 pointer-events-none">
<div class="flex flex-col space-y-2 opacity-60">
<span class="font-data-sm text-data-sm text-primary">RAW_SIGNAL_IN</span>
<div class="w-24 h-px bg-primary/50"></div>
</div>
<div class="w-32 h-32 md:w-48 md:h-48 rounded-full border border-primary/30 flex items-center justify-center animate-[spin_20s_linear_infinite]">
<div class="w-24 h-24 md:w-36 md:h-36 rounded-full border-2 border-primary/10 border-t-primary/80"></div>
</div>
<div class="flex flex-col space-y-2 text-right opacity-90">
<span class="font-data-sm text-data-sm text-primary">ALPHA_ISOLATED</span>
<div class="w-24 h-px bg-primary ml-auto"></div>
</div>
</div>
</div>
<!-- Configuration Panel -->
<div class="w-full max-w-2xl glass-card rounded-xl p-8 md:p-12 space-y-12">
<!-- Risk Archetype Selection -->
<div class="space-y-6">
<div class="flex items-center justify-between border-b border-outline-variant/30 pb-2">
<h2 class="font-data-lg text-data-lg text-on-surface">Risk Archetype</h2>
<span class="material-symbols-outlined text-outline text-sm" style="font-variation-settings: 'FILL' 0;">tune</span>
</div>
<div class="grid grid-cols-3 gap-4">
<button class="py-3 px-2 rounded font-data-sm text-data-sm text-center border border-outline-variant/50 text-on-surface-variant hover:border-primary/50 hover:text-primary transition-all duration-200">
                        CONSERVATIVE
                    </button>
<!-- Active State -->
<button class="py-3 px-2 rounded font-data-sm text-data-sm text-center bg-primary/10 border border-primary text-primary shadow-[0_0_15px_rgba(0,229,255,0.15)] relative overflow-hidden group">
<div class="absolute inset-0 bg-primary/20 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
                        MODERATE
                    </button>
<button class="py-3 px-2 rounded font-data-sm text-data-sm text-center border border-outline-variant/50 text-on-surface-variant hover:border-primary/50 hover:text-primary transition-all duration-200">
                        AGGRESSIVE
                    </button>
</div>
</div>
<!-- Parameters -->
<div class="space-y-8">
<!-- Max Drawdown -->
<div class="space-y-4 glow-active p-2 rounded-lg transition-all duration-300">
<div class="flex justify-between items-end">
<label class="font-data-sm text-data-sm text-on-surface-variant uppercase tracking-wider">Max Drawdown Hard Stop</label>
<span class="font-data-lg text-data-lg text-primary" id="drawdown-val">15.0%</span>
</div>
<div class="relative pt-2">
<input class="w-full" max="30" min="5" oninput="document.getElementById('drawdown-val').innerText = parseFloat(this.value).toFixed(1) + '%'" step="0.5" type="range" value="15"/>
<div class="flex justify-between mt-2 font-data-sm text-data-sm text-outline opacity-50">
<span>5%</span>
<span>30%</span>
</div>
</div>
</div>
<!-- Noise Rejection -->
<div class="space-y-4 glow-active p-2 rounded-lg transition-all duration-300">
<div class="flex justify-between items-end">
<label class="font-data-sm text-data-sm text-on-surface-variant uppercase tracking-wider">Market Noise Rejection</label>
<span class="font-data-lg text-data-lg text-primary" id="noise-val">Optimal</span>
</div>
<div class="relative pt-2">
<input class="w-full" max="100" min="1" oninput="
                            let val = this.value;
                            let text = val &lt; 30 ? 'Low' : (val &gt; 80 ? 'High' : 'Optimal');
                            document.getElementById('noise-val').innerText = text;
                        " type="range" value="70"/>
<div class="flex justify-between mt-2 font-data-sm text-data-sm text-outline opacity-50">
<span>Low</span>
<span>High</span>
</div>
</div>
</div>
</div>
<!-- Action Area -->
<div class="pt-8 border-t border-outline-variant/30 flex justify-center">
<button class="w-full md:w-auto px-12 py-4 bg-primary text-[#000000] font-label-caps text-label-caps rounded flex items-center justify-center space-x-2 hover:bg-primary-fixed hover:shadow-[0_0_20px_rgba(0,229,255,0.4)] transition-all duration-300">
<span class="material-symbols-outlined text-base" style="font-variation-settings: 'FILL' 1;">lock</span>
<span>LOCK PARAMETERS</span>
</button>
</div>
</div>
</main>
<!-- Footer Anchorage (Hidden per instructions for focused flow, maintaining structure comment) -->
</body></html>
